# Mount this row in an agent preset composition. The agent-preset scope makes
# these registrations model-visible only to agents using the Search Hub preset.
- id: search-hub
  name: ./search-hub.mjs
  config:
    xaiCredentialRef: XAI_API_KEY
    grokModel: grok-4.6
    timeoutMs: 30000
    maxResults: 8
